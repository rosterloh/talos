name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lint (no ROS 2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Runs before the workspace is trimmed below, so talos-agent is covered.
      # `cargo fmt` only parses manifests, so it needs no ROS 2 environment.
      - name: Check formatting
        run: cargo fmt --all --check

      - name: Prepare non-ROS workspace
        run: python3 .github/scripts/prepare_non_ros_workspace.py

      - name: Clippy
        run: |
          cargo clippy -p talos-common -p talos-cli -p talos-tui \
            --all-targets -- -D warnings

      - name: Clippy (quic)
        run: |
          cargo clippy -p talos-common -p talos-cli -p talos-tui \
            --all-targets --features quic -- -D warnings

      - name: Test
        run: cargo test -p talos-common -p talos-cli -p talos-tui --features quic

  agent:
    name: Build and test talos-agent (ROS 2 Lyrical, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          # The robot target; native Arm runner, not emulation.
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      # talos-agent is the only crate that needs the ROS 2 runtime, and the
      # only place a bridge regression can be caught: tests/bridge_live.rs
      # publishes on a real topic and asserts the bridge forwards it.
      - name: Clippy
        run: |
          pixi run -- cargo clippy --workspace --all-targets \
            --features quic -- -D warnings

      - name: Test
        run: pixi run -- cargo test --workspace --features quic
