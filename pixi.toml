[workspace]
authors = ["Richard Osterloh <richard.osterloh@gmail.com>"]
channels = ["https://repo.prefix.dev/robostack-lyrical", "conda-forge"]
name = "talos"
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
version = "1.0.0"

# The agent links rclrs (from crates.io) against the ROS 2 Lyrical runtime and
# the pre-generated Rust message bindings shipped by the robostack-lyrical
# conda packages. No ROS 2 source build is required — `ros-env` compiles the
# bindings it finds on AMENT_PREFIX_PATH.
[tasks]
build = "cargo build"
build-quic = "cargo build --features quic"
check = "cargo check --workspace"
test = "cargo test --workspace"

[dependencies]
# RoboStack names ROS 2 packages `ros2-*`; the channel and this mutex pick the distro.
ros2-distro-mutex = { version = "*", build = "lyrical*" }
ros2-ros-base = ">=0.13.0,<0.14"
rust = ">=1.98.1,<1.99"
pkg-config = ">=0.29.2,<0.30"
# >=2: the clang config files add the env lib dir as an rpath on macOS.
compilers = ">=2.0.0,<3"
