[workspace]
resolver = "3"
members = [
    "talos-cli",
    "talos-common",
    "talos-agent",
    "talos-tui",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Richard Osterloh <richard.osterloh@gmail.com>"]
license = "MIT"

[workspace.dependencies]
talos-common = { path = "talos-common" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
toml = "1"
thiserror = "2"

# ROS 2 Lyrical support landed upstream in ros2-rust/ros2_rust#658 but is not
# released: crates.io rclrs 0.7.0 predates it and panics with "Unsupported ROS
# distribution". Drop this patch once a release with the lyrical bindings ships.
# The message crate patches live in .cargo/config.toml (auto-generated).
[patch.crates-io.rclrs]
git = "https://github.com/ros2-rust/ros2_rust"
rev = "2766eab6e1e9208a67e8570bfa5027ec38387534"
