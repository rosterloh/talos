[package]
name = "talos-agent"
description = "ROS 2 bridge agent for Talos"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
quic = ["talos-common/quic", "dep:quinn"]

[dependencies]
talos-common = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
tokio-util = { workspace = true }
bytes = { workspace = true }
futures-util = { version = "0.3.34", features = ["sink"] }
rclrs = "0.8.0"
rosidl_runtime_rs = "0.7.0"
ros-env = "0.3.0"

# Only needed when quic feature is enabled (for type references in server.rs)
quinn = { version = "0.11.12", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
rclrs = "0.8.0"
